name: ProofLine CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run docs:check
      - run: npm run test:built
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --workspace --release
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17, cache: gradle }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - working-directory: android
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: FedericoCarboni/setup-ffmpeg@v3
      - run: npm ci
      - run: docker compose -f docker-compose.yml -f docker-compose.test.yml up -d --build --wait
      - run: npm run test:media
      - if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml logs
  c2pa:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FedericoCarboni/setup-ffmpeg@v3
      - shell: pwsh
        run: ./scripts/c2pa-spike.ps1
      - uses: actions/upload-artifact@v4
        with: { name: c2pa-validation, path: examples/c2pa/*validation* }
