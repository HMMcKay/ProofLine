:root[data-theme=&quot;light&quot;] {
  color-scheme: light;
}

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans);
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: pointer;
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;
}

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align=&quot;right&quot;]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control::placeholder {
  color: var(--muted-foreground);
}

.form-control[type=&quot;file&quot;] {
  padding: 0;
  overflow: hidden;
  cursor: var(--cursor-interaction, pointer);
}

.form-control[type=&quot;file&quot;]::file-selector-button {
  min-height: 26px;
  margin-right: 8px;
  padding: 0 8px;
  border: 0;
  border-right: 1px solid var(--input);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;
  font: inherit;
}

.form-control[type=&quot;file&quot;]:not(:disabled):hover::file-selector-button {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-control-color[type=&quot;color&quot;] {
  width: 40px;
  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch-wrapper {
  padding: 0;
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch {
  border: 0;
  border-radius: calc(var(--radius-lg) - 4px);
  corner-shape: superellipse(1.5);
}

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);

  background: var(--primary-foreground);

  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

  &lt;section class=&quot;pl-panel&quot; data-pl-panel=&quot;claims&quot; aria-labelledby=&quot;pl-claims-title&quot; hidden&gt;
    &lt;span class=&quot;viz-badge&quot;&gt;Interpretation model&lt;/span&gt;
    &lt;h2 id=&quot;pl-claims-title&quot;&gt;Integrity is not the same thing as truth&lt;/h2&gt;
    &lt;div class=&quot;pl-claim-grid&quot;&gt;
      &lt;section&gt;&lt;h3 class=&quot;pl-claim-title&quot;&gt;&lt;span class=&quot;pl-dot&quot;&gt;&lt;/span&gt;Established by valid records&lt;/h3&gt;&lt;ul class=&quot;pl-clean-list&quot;&gt;&lt;li&gt;Exported bytes match signed fragment digests and server receipts.&lt;/li&gt;&lt;li&gt;The shown start is the first encoded frame in the signed chain.&lt;/li&gt;&lt;li&gt;A signed ending covers every declared accepted track, count, and last digest.&lt;/li&gt;&lt;li&gt;An interrupted ending is the highest contiguous prefix accepted by the server.&lt;/li&gt;&lt;li&gt;Visible gaps, conflicts, mutations, and forged signatures are not silently normalized.&lt;/li&gt;&lt;/ul&gt;&lt;/section&gt;
      &lt;section&gt;&lt;h3 class=&quot;pl-claim-title&quot;&gt;&lt;span class=&quot;pl-dot corroborate&quot;&gt;&lt;/span&gt;Corroborating evidence&lt;/h3&gt;&lt;ul class=&quot;pl-clean-list&quot;&gt;&lt;li&gt;Attestation can describe key security level and measured app/device state at enrollment.&lt;/li&gt;&lt;li&gt;Server receipt time and optional TSA anchors support a time window.&lt;/li&gt;&lt;li&gt;GNSS, pressure, motion, orientation, monotonic time, thermal, and battery samples add context.&lt;/li&gt;&lt;li&gt;Dual cameras can provide linked viewpoints when the hardware allows them.&lt;/li&gt;&lt;li&gt;Public audit replication and independent bundle verification reduce reliance on the UI.&lt;/li&gt;&lt;/ul&gt;&lt;/section&gt;
      &lt;section&gt;&lt;h3 class=&quot;pl-claim-title&quot;&gt;&lt;span class=&quot;pl-dot limit&quot;&gt;&lt;/span&gt;Not established&lt;/h3&gt;&lt;ul class=&quot;pl-clean-list&quot;&gt;&lt;li&gt;That a scene was not staged, coerced, replayed to the lens, or framed selectively.&lt;/li&gt;&lt;li&gt;That a rooted device, camera HAL, firmware, or sensor stack reported honestly.&lt;/li&gt;&lt;li&gt;That the sensor produced no frames after the server&#x27;s last receipt.&lt;/li&gt;&lt;li&gt;Exact clock truth from the phone alone, or the identity of the human operator.&lt;/li&gt;&lt;li&gt;Court admissibility, legal authenticity findings, or case-specific evidentiary weight.&lt;/li&gt;&lt;/ul&gt;&lt;/section&gt;

    &lt;h2 id=&quot;pl-readiness-title&quot;&gt;Substantial implementation; explicit go-live gates remain&lt;/h2&gt;
    &lt;div class=&quot;pl-two&quot;&gt;
      &lt;div&gt;
        &lt;h3&gt;Validated locally&lt;/h3&gt;
        &lt;div class=&quot;pl-status-line&quot;&gt;&lt;strong&gt;Web control plane&lt;/strong&gt;&lt;span&gt;lint · typecheck · vectors · rendered routes · production build · desktop/mobile browser&lt;/span&gt;&lt;/div&gt;

        &lt;div class=&quot;pl-status-line&quot;&gt;&lt;strong&gt;C2PA fixture&lt;/strong&gt;&lt;span&gt;official c2patool 0.26.60 validates AVC/AAC CMAF binding; dev credential untrusted as expected&lt;/span&gt;&lt;/div&gt;

        &lt;h3&gt;Not yet production-verified&lt;/h3&gt;
        &lt;div class=&quot;pl-status-line&quot;&gt;&lt;strong&gt;Physical-device matrix&lt;/strong&gt;&lt;span&gt;pending&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;pl-status-line&quot;&gt;&lt;strong&gt;Production attestation verifier&lt;/strong&gt;&lt;span&gt;pending&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;pl-status-line&quot;&gt;&lt;strong&gt;Production TSA/C2PA trust&lt;/strong&gt;&lt;span&gt;pending&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;pl-status-line&quot;&gt;&lt;strong&gt;VPS + public access switch&lt;/strong&gt;&lt;span&gt;pending explicit go-live approval&lt;/span&gt;&lt;/div&gt;

    &lt;div class=&quot;card pl-section&quot;&gt;&lt;strong&gt;Deployment safety gate&lt;/strong&gt;&lt;div class=&quot;text-small text-muted&quot;&gt;The existing Sites project is bound but remains private as the rollback version. Replacing it and enabling anonymous public capture requires explicit confirmation immediately before the access switch.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;pl-foot text-small&quot;&gt;No result is labeled ironclad, court-certified, or guaranteed admissible. C2PA binds provenance assertions to media; it does not certify objective scene truth.&lt;/div&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;proofline-project-overview&#x27;);
      if (!root) return;

      const stages = [
        { kicker: &#x27;Identity witness&#x27;, title: &#x27;Enroll a pseudonymous device key&#x27;, summary: &#x27;Android requests an attestation challenge and generates a non-exportable P-256 key in StrongBox when available, otherwise the TEE. The PWA uses a browser key.&#x27;, check: &#x27;Attestation chain, challenge, app/package identity, security state, revocation and SPKI fingerprint when a production verifier is configured.&#x27;, claim: &#x27;A specific signing key—with an explicit assurance level—created or authorized the capture session.&#x27;, limit: &#x27;The key is not a human identity, and local assurance is never upgraded to verified hardware assurance without server validation.&#x27; },
        { kicker: &#x27;Low-frequency authority&#x27;, title: &#x27;Bind an ephemeral session key&#x27;, summary: &#x27;The device identity signs the fresh nonce, capture ID, policy, declared streams, start time and ephemeral session public key.&#x27;, check: &#x27;Canonical JSON plus ES256 signature over the complete session binding.&#x27;, claim: &#x27;High-frequency fragment signatures belong to a session authorized by the enrolled identity key.&#x27;, limit: &#x27;A compromised unlocked device may still use its legitimate key.&#x27; },
        { kicker: &#x27;Capture witness&#x27;, title: &#x27;Encode media and telemetry in short intervals&#x27;, summary: &#x27;Video/audio are cut into roughly two-second signed assets. Telemetry is batched and linked through a telemetry root.&#x27;, check: &#x27;Exact media bytes, stream ID, sequence, predecessor, PTS bounds, byte count, telemetry root and session signature.&#x27;, claim: &#x27;Each accepted object occupies one explicit position in an app-signed capture chain.&#x27;, limit: &#x27;The first-frame claim begins at the first encoded frame; Android does not provide a universal sensor-to-signature path.&#x27; },
        { kicker: &#x27;Server witness&#x27;, title: &#x27;Rehash, validate and durably store&#x27;, summary: &#x27;The gateway independently hashes the request body, enforces identity, structure, codec, order, predecessor, size and quota, then writes the object before acknowledging it.&#x27;, check: &#x27;Independent digest, durable object key/version, sequence, predecessor and signed server receipt time.&#x27;, claim: &#x27;Those exact bytes were durably received by that server no later than the signed receipt time.&#x27;, limit: &#x27;A receipt does not mean the sensor produced no later frame.&#x27; },
        { kicker: &#x27;Independent-time option&#x27;, title: &#x27;Anchor newly accepted receipts&#x27;, summary: &#x27;Every 60 seconds, new receipt leaves are assembled into a deterministic Merkle root and signed; an RFC 3161 request can be sent to a configured TSA.&#x27;, check: &#x27;Leaf set, Merkle construction, server signature, raw TSA response and validation status.&#x27;, claim: &#x27;A compact, reproducible commitment covers the receipt set; a valid TSA response corroborates time independently.&#x27;, limit: &#x27;TSA failure is a warning, not a reason to discard already durable media.&#x27; },
        { kicker: &#x27;Completeness decision&#x27;, title: &#x27;Seal deliberately or finalize an interruption&#x27;, summary: &#x27;A valid device-signed end manifest seals exact stream counts and final digests. Silence produces stalled at 30 seconds and interrupted after the 15-minute continuation window.&#x27;, check: &#x27;End signer, stream declarations, counts, last chain digests, end time and close reason—or highest contiguous accepted prefix.&#x27;, claim: &#x27;Sealed and interrupted outcomes have different, precise completeness wording.&#x27;, limit: &#x27;Late valid data becomes a recovery supplement and never rewrites prior receipts or the original interruption assertion.&#x27; },
        { kicker: &#x27;Independent inspection&#x27;, title: &#x27;Export a self-contained evidence record&#x27;, summary: &#x27;The worker emits canonical JSON, detached server signature, PDF with QR permalink, raw fragments and a ZIP evidence bundle.&#x27;, check: &#x27;Recomputed hashes, signatures, chains, receipts, anchor roots, end manifest, audit events and C2PA status.&#x27;, claim: &#x27;A verifier can recheck immutable evidence without trusting the presentation layer.&#x27;, limit: &#x27;The current final capture asset is not C2PA-authored; the report labels that unsupported.&#x27; }
      ];

      const evidence = [
        { name: &#x27;Media bytes&#x27;, category: &#x27;Primary integrity&#x27;, collected: &#x27;Exact uploaded ISO BMFF/MediaRecorder fragment bytes plus byte length and SHA-256.&#x27;, tells: &#x27;Downloaded bytes are identical to the bytes hashed, chained, stored and receipted.&#x27;, limit: &#x27;Nothing about frames never encoded or never transmitted.&#x27;, status: &#x27;Implemented and exercised by mutation tests.&#x27; },
        { name: &#x27;Audio track&#x27;, category: &#x27;Primary integrity&#x27;, collected: &#x27;Microphone audio multiplexed into the fragment bytes; declared once as shared evidence when cameras are linked.&#x27;, tells: &#x27;The accepted audio bytes are bound to the same fragment object; independent report roots expose track results.&#x27;, limit: &#x27;Cannot rule out replayed sound, an edited source before encoding, or a compromised audio stack.&#x27;, status: &#x27;Captured in PWA/native segments; official AAC CMAF binding validated only in the compatibility fixture.&#x27; },

        { name: &#x27;Device identity&#x27;, category: &#x27;Signer provenance&#x27;, collected: &#x27;P-256 SPKI fingerprint, certificate chain, challenge and declared assurance level; no restricted hardware IDs.&#x27;, tells: &#x27;Captures can be grouped by a pseudonymous signing-key lineage and, after validation, by security level.&#x27;, limit: &#x27;Does not identify the human or guarantee the device was uncompromised.&#x27;, status: &#x27;Key generation implemented; physical StrongBox/TEE server verification remains untested.&#x27; },
        { name: &#x27;Session binding&#x27;, category: &#x27;Signer provenance&#x27;, collected: &#x27;Fresh nonce, capture policy, stream declarations, session SPKI and device-key signature.&#x27;, tells: &#x27;The high-rate session signer was authorized for this capture and those declared streams.&#x27;, limit: &#x27;Does not establish operator intent or scene truth.&#x27;, status: &#x27;Implemented for Android and PWA.&#x27; },
        { name: &#x27;Server receipts&#x27;, category: &#x27;Custody and time&#x27;, collected: &#x27;Independent digest, object version, sequence, predecessor, server receipt time and server ES256 signature.&#x27;, tells: &#x27;A named server durably held the exact fragment at that recorded point in the chain.&#x27;, limit: &#x27;Not proof of the last frame ever produced by the phone.&#x27;, status: &#x27;Implemented; durable-write-before-receipt behavior exercised.&#x27; },
        { name: &#x27;Signed ending&#x27;, category: &#x27;Completeness&#x27;, collected: &#x27;Every stream ID, sequence count, final digest, duration, end time and close reason signed by the device key.&#x27;, tells: &#x27;A deliberate/controlled ending reconciles with the accepted streams, or a mismatch becomes gaps detected.&#x27;, limit: &#x27;Absent ending cannot be inferred as a deliberate stop.&#x27;, status: &#x27;Implemented; wrong signer and valid device signer both exercised.&#x27; },

        { name: &#x27;Receipt anchors&#x27;, category: &#x27;Custody and time&#x27;, collected: &#x27;Deterministic Merkle root over newly accepted receipt leaves, leaf set, server signature, optional raw RFC 3161 response.&#x27;, tells: &#x27;One compact commitment covers many prior receipts; a validated TSA token adds an independent time witness.&#x27;, limit: &#x27;A server-only signed root is not an independent witness, and raw TSA bytes still require validation.&#x27;, status: &#x27;Merkle and request logic tested; production TSA validation not configured.&#x27; },
        { name: &#x27;Audit + tombstone&#x27;, category: &#x27;Custody and policy&#x27;, collected: &#x27;Append-only signed evidence events, recovery supplements and offline-admin-signed tombstone actions/reasons.&#x27;, tells: &#x27;Later changes and safety actions remain attributable and visible without rewriting original history.&#x27;, limit: &#x27;Tombstoned media is intentionally unavailable through public playback/download endpoints.&#x27;, status: &#x27;Implemented; invalid/valid tombstone and retained-report behavior exercised.&#x27; },
        { name: &#x27;C2PA status&#x27;, category: &#x27;Interoperability&#x27;, collected: &#x27;Official-tool validation reports for a committed AVC/AAC CMAF compatibility fixture; explicit status in every evidence report.&#x27;, tells: &#x27;The target fragmented-BMFF binding can validate with the pinned official tool.&#x27;, limit: &#x27;The current Android/PWA capture output is not that CMAF shape and has no live/final C2PA claim.&#x27;, status: &#x27;Compatibility spike valid with untrusted development credential; production trust not configured.&#x27; },
        { name: &#x27;Evidence bundle&#x27;, category: &#x27;Independent verification&#x27;, collected: &#x27;Canonical JSON, detached JSON/PDF signatures, PDF report, raw accepted fragments, keys, receipts, anchors, manifests and audit records.&#x27;, tells: &#x27;A third party can recompute bindings without relying on the web UI.&#x27;, limit: &#x27;Independent verification still relies on evaluating key custody, trust chains and jurisdictional rules.&#x27;, status: &#x27;Implemented; PDF rendered and bundle path exercised locally.&#x27; }

      root.querySelectorAll(&#x27;[data-pl-stage]&#x27;).forEach((button) =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; selectStage(Number(button.dataset.plStage))));

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {

    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);

    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;

    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);

    );

  };

    clearOpenTimeout();

              &quot;--tooltip-available-height&quot;,

      .then(({ x, y }) =&gt; {

  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);

      return;
    }

    floating.style.visibility = &quot;hidden&quot;;

    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger

      return;
    }

    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil

      return;

    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
