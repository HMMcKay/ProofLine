[workspace]
resolver = "2"
members = ["crates/proofline-protocol", "services/media"]

[workspace.package]
edition = "2024"
license = "Apache-2.0 OR MIT"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0.98"
base64 = "0.22.1"
chrono = { version = "0.4.41", features = ["serde"] }
hex = "0.4.3"
p256 = { version = "0.13.2", features = ["ecdsa", "pem", "pkcs8"] }
rand_core = "0.6.4"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
thiserror = "2.0.12"

