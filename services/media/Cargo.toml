[package]
name = "proofline-media"
version = "2.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
default-run = "proofline-gateway"

[[bin]]
name = "proofline-gateway"
path = "src/bin/gateway.rs"

[[bin]]
name = "proofline-worker"
path = "src/bin/worker.rs"

[[bin]]
name = "proofline-admin"
path = "src/bin/admin.rs"

[dependencies]
anyhow.workspace = true
async-stream = "0.3.6"
axum = { version = "0.8.4", features = ["macros"] }
base64.workspace = true
bytes = "1.10.1"
chrono.workspace = true
clap = { version = "4.5.40", features = ["derive", "env"] }
futures = "0.3.31"
hex.workspace = true
hmac = "0.12.1"
http = "1.3.1"
object_store = { version = "0.12.3", features = ["aws"] }
p256.workspace = true
proofline-protocol = { path = "../../crates/proofline-protocol" }
rand_core.workspace = true
qrcodegen = "1.8.0"
reqwest = { version = "0.12.20", default-features = false, features = ["json", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "migrate"] }
subtle = "2.6.1"
tokio = { version = "1.45.1", features = ["macros", "rt-multi-thread", "signal", "time", "fs"] }
tower-http = { version = "0.6.6", features = ["cors", "trace", "request-id"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }
url = "2.5.4"
uuid = { version = "1.16.0", features = ["v4", "serde"] }
x509-parser = "0.17.0"
zip = { version = "4.0.0", default-features = false, features = ["deflate"] }
